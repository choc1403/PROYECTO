<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Productos</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <meta http-equiv='refresh' content='8'>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #fafafa;
      color: #111;
      padding: 2rem;
      max-width: 760px;
      margin: 0 auto;
    }

    .toolbar {
      display: flex;
      gap: .6rem;
      margin-bottom: 1.5rem;
    }

    input[type="text"] {
      flex: 1;
      padding: .5rem .75rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: .9rem;
      background: #fff;
      outline: none;
      transition: border-color .15s;
    }
    input[type="text"]:focus { border-color: #888; }

    button {
      padding: .5rem .9rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fff;
      font-size: .9rem;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
    }
    button:hover  { background: #f0f0f0; }
    button:active { background: #e8e8e8; }

    .chart-wrap {
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 8px;
      padding: 1.25rem 1.25rem 1rem;
      margin-bottom: 1.5rem;
    }
    .chart-label {
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: #aaa;
      margin-bottom: .75rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .88rem;
    }
    thead th {
      text-align: left;
      padding: .5rem .75rem;
      border-bottom: 1.5px solid #e0e0e0;
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: #888;
      font-weight: 500;
      white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid #f0f0f0; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f9f9f9; }
    td { padding: .6rem .75rem; }

    .stock {
      display: inline-block;
      padding: .15rem .55rem;
      border-radius: 99px;
      font-size: .78rem;
      font-weight: 500;
    }
    .ok  { background: #e8f5e9; color: #2e7d32; }
    .low { background: #fff8e1; color: #f57f17; }
    .out { background: #fce4ec; color: #b71c1c; }

    .empty { text-align: center; padding: 2.5rem; color: #bbb; font-size: .88rem; }
    .muted { color: #999; font-size: .82rem; }
  </style>
</head>
<body>

<div class="toolbar">
  <input id="q" type="text" placeholder="Buscar producto…" oninput="render()"/>
  <button onclick="load()">↻ Actualizar</button>
</div>

<div class="chart-wrap">
  <div class="chart-label">Stock por producto</div>
  <canvas id="chart" height="100"></canvas>
</div>

<table>
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Stock</th>
      <th>Fecha / Hora</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<script>
  // Obtener el protocolo (HTTP/HTTPS)
  const protocolo = window.location.protocol; // Ejemplo: "https:"

  // Obtener el dominio (hostname)
  const dominio = window.location.hostname; // Ejemplo: "example.com"

  // Obtener el puerto
  const puerto = window.location.port; // Ejemplo: "8080" o "" si no está explícito
  const baseUrl = `${protocolo}//${dominio}${puerto ? `:${puerto}` : ''}`;
  
  const API =  `${baseUrl}/lecturas/api/producto/`;
  let data  = [];
  let chart = null;

  async function load() {
    document.getElementById('tbody').innerHTML =
      '<tr><td colspan="3" class="empty">Cargando…</td></tr>';
    try {
      const res  = await fetch(API);
      const json = await res.json();
      data = Array.isArray(json) ? json : (json.results ?? []);
      render();
    } catch {
      document.getElementById('tbody').innerHTML =
        '<tr><td colspan="3" class="empty">No se pudo conectar con la API.</td></tr>';
    }
  }

  function render() {
    const q    = document.getElementById('q').value.toLowerCase();
    const rows = data.filter(p => (p.nombre ?? '').toLowerCase().includes(q));
    updateChart(rows);

    if (!rows.length) {
      document.getElementById('tbody').innerHTML =
        '<tr><td colspan="3" class="empty">Sin resultados.</td></tr>';
      return;
    }

    document.getElementById('tbody').innerHTML = rows.map(p => {
      const cls   = p.stock <= 0 ? 'out' : p.stock <= 5 ? 'low' : 'ok';
      const fecha = p.fecha_hora
        ? new Date(p.fecha_hora).toLocaleString('es-GT', { dateStyle:'short', timeStyle:'short' })
        : '—';
      return `<tr>
        <td>${esc(p.nombre)}</td>
        <td><span class="stock ${cls}">${p.stock ?? 0}</span></td>
        <td class="muted">${fecha}</td>
      </tr>`;
    }).join('');
  }

  function updateChart(rows) {
    const sorted = [...rows].sort((a, b) =>
      new Date(a.fecha_hora) - new Date(b.fecha_hora)
    );

    // Eje X: nombre del producto + fecha corta
    const labels = sorted.map(p => {
      const fecha = p.fecha_hora
        ? new Date(p.fecha_hora).toLocaleDateString('es-GT', { dateStyle: 'short' })
        : '';
      return [p.nombre ?? '—', fecha];
    });
    const values = sorted.map(p => p.stock ?? 0);

    if (chart) {
      chart.data.labels           = labels;
      chart.data.datasets[0].data = values;
      chart.update();
      return;
    }

    chart = new Chart(document.getElementById('chart'), {
      type: 'line',
      data: {
        labels,
        datasets: [{
          label: 'Stock',
          data: values,
          borderColor: '#111',
          borderWidth: 1.5,
          pointBackgroundColor: '#111',
          pointRadius: 3,
          pointHoverRadius: 5,
          fill: true,
          backgroundColor: 'rgba(0,0,0,.04)',
          tension: .35
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              // tooltip: nombre completo + fecha + stock
              title: ctx => {
                const p = sorted[ctx[0].dataIndex];
                return p ? (p.nombre ?? '—') : '';
              },
              label: ctx => {
                const p = sorted[ctx.dataIndex];
                const fecha = p?.fecha_hora
                  ? new Date(p.fecha_hora).toLocaleString('es-GT', { dateStyle:'short', timeStyle:'short' })
                  : '—';
                return [` Stock: ${ctx.parsed.y}`, ` Fecha: ${fecha}`];
              }
            }
          }
        },
        scales: {
          x: {
            grid: { display: false },
            ticks: {
              color: '#aaa',
              font: { size: 11 },
              maxRotation: 30,
              // Chart.js renderiza arrays como líneas múltiples automáticamente
            }
          },
          y: {
            beginAtZero: true,
            grid: { color: '#f0f0f0' },
            ticks: { color: '#aaa', font: { size: 11 }, precision: 0 }
          }
        }
      }
    });
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  load();
</script>
</body>
</html>
